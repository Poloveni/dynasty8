<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cohérences — Dynasty 8</title>
<meta name="description" content="Découvrez les biens par cohérence (zone) : Habitation, Garage, Cayo, Roxwood.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
</head>
<body>

<header class="entete" id="site-entete"></header>

<section class="hero" style="padding:70px 24px 50px;">
  <div class="hero-etiquette">📍 Cohérences</div>
  <h1>Une zone pour chaque histoire</h1>
  <p class="lead">Sur Los Santos, chaque secteur a sa cohérence propre. Choisissez une zone pour découvrir les biens qui lui correspondent.</p>
</section>

<section class="section serre">
  <div class="conteneur">
    <div class="grille-zones" id="grille-zones"></div>
  </div>
</section>

<section class="section alterne">
  <div class="conteneur">
    <div class="section-entete" style="margin-bottom:30px;">
      <h2 id="titre-resultats">Toutes les cohérences</h2>
      <p id="sous-titre-resultats">L'ensemble des biens répertoriés dans nos différentes zones.</p>
    </div>
    <div class="grille-biens" id="grille-biens"></div>
  </div>
</section>

<footer class="pied-page" id="site-pied"></footer>

<script src="/layout.js"></script>
<script src="/biens.js"></script>
<script>
  initialiserLayout("coherences");

  const ZONES = [
    { nom: "Habitation", description: "Quartiers résidentiels calmes, proches des commerces et services." },
    { nom: "Garage", description: "Secteur dédié aux passionnés de mécanique et de collection." },
    { nom: "Cayo", description: "Îles privées et villas isolées, loin de l'agitation de la ville." },
    { nom: "Roxwood", description: "Quartier d'affaires prisé par les entrepreneurs de la ville." },
  ];

  const zoneActuelle = new URLSearchParams(window.location.search).get("zone");

  document.getElementById("grille-zones").innerHTML = ZONES.map((z) => `
    <a class="carte-zone" href="/coherences.html?zone=${encodeURIComponent(z.nom)}" style="${z.nom === zoneActuelle ? 'border-color:var(--accent);' : ''}">
      <h3>${z.nom}</h3>
      <p>${z.description}</p>
      <span class="compte">Voir les biens →</span>
    </a>`).join("") + `<a class="carte-zone" href="/coherences.html" style="${!zoneActuelle ? 'border-color:var(--accent);' : ''}"><h3>Toutes les zones</h3><p>Afficher l'ensemble du catalogue « Cohérences ».</p><span class="compte">Voir tout →</span></a>`;

  if (zoneActuelle) {
    document.getElementById("titre-resultats").textContent = "Zone : " + zoneActuelle;
    document.getElementById("sous-titre-resultats").textContent = "Biens disponibles dans cette cohérence.";
  }

  chargerBiens({ categorie: "coherence", zone: zoneActuelle || undefined, cible: "grille-biens" });
</script>
</body>
</html>
