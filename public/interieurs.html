<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intérieurs — Dynasty 8</title>
<meta name="description" content="Découvrez les intérieurs meublés et non meublés disponibles à la vente ou à la location avec Dynasty 8.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/favicon-180.png">
</head>
<body>

<header class="entete" id="site-entete"></header>

<section class="hero" style="padding:70px 24px 50px;">
  <div class="hero-etiquette">🏠 Intérieurs</div>
  <h1>Des intérieurs pour chaque style de vie</h1>
  <p class="lead">Appartements meublés prêts à vivre ou espaces bruts à personnaliser entièrement : trouvez l'intérieur qui vous ressemble.</p>
</section>

<section class="section serre">
  <div class="conteneur">
    <div class="filtres" id="filtres-interieurs">
      <button class="filtre" data-sous-categorie="tous">Tous</button>
      <button class="filtre" data-sous-categorie="meuble">Meublés</button>
      <button class="filtre" data-sous-categorie="non-meuble">Non meublés</button>
    </div>
    <div class="grille-biens" id="grille-biens"></div>
  </div>
</section>

<footer class="pied-page" id="site-pied"></footer>

<script src="/layout.js"></script>
<script src="/biens.js"></script>
<script>
  initialiserLayout("interieurs");
  initialiserFiltres("filtres-interieurs", "grille-biens", "interieur");
</script>
</body>
</html>
